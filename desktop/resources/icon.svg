<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#06060f" stroke="url(#grad)" stroke-width="2"/>
  <!-- Outer ring -->
  <circle cx="128" cy="128" r="100" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.3"/>
  <circle cx="128" cy="128" r="85" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.2"/>
  <!-- Core orb -->
  <circle cx="128" cy="128" r="45" fill="url(#grad)" opacity="0.9"/>
  <circle cx="128" cy="128" r="45" fill="none" stroke="#a5b4fc" stroke-width="1" opacity="0.4"/>
  <!-- Inner highlight -->
  <circle cx="118" cy="118" r="20" fill="white" opacity="0.1"/>
  <!-- Center dot -->
  <circle cx="128" cy="128" r="6" fill="white" opacity="0.8"/>
  <!-- Text -->
  <text x="128" y="210" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#818cf8" opacity="0.6" letter-spacing="4">JARVIS</text>
</svg>
